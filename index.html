  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Steal An Egg - Egg Selector</title>
  <link href="./Steal An Egg - Egg Selector_files/css2" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --font: 'Fredoka One', 'Trebuchet MS', system-ui, sans-serif;
      --card: #fff;
      --radius: clamp(16px, 3vw, 24px);
      --btn-radius: clamp(14px, 2.5vw, 20px);
      --green-grad: linear-gradient(180deg, #7fff20 0%, #22dd10 50%, #14b80a 100%);
      --green-shadow: #0a6e08;
      --grey-grad: linear-gradient(180deg, #f4f6f8 0%, #dfe4ea 100%);
      --grey-shadow: #b8c0ca;
      --text: #2a2a2a;
      --subtext: #aaa;
      --input-border: #e0e0e0;
      --avatar-bg: #f4f4f4;
      --card-shadow: 0 20px 60px rgba(0,0,0,.18), 0 4px 16px rgba(0,0,0,.10);
      --press: linear-gradient(rgba(0,0,0,.12), rgba(0,0,0,.12));
      --stroke:
        -2px -2px 0 #111, 2px -2px 0 #111,
        -2px  2px 0 #111, 2px  2px 0 #111,
         0   -2px 0 #111, 0    2px 0 #111,
        -2px  0   0 #111, 2px  0   0 #111;
    }

    html, body { min-height: 100%; margin: 0; }

    body {
      font-family: var(--font);
      background:
        radial-gradient(ellipse 65% 90% at 0% 50%,   #28e8c8 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 100% 60%, #80ff30 0%, transparent 60%),
        radial-gradient(ellipse 80% 50% at 50% 0%,   #72d4f0 0%, transparent 60%),
        linear-gradient(135deg, #4cd4c0 0%, #60bce8 40%, #78e060 75%, #a0ff38 100%);
      background-attachment: fixed;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    img { display: block; max-width: 100%; user-select: none; }

    /* ── Page ── */
    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(5.5rem, 22vw, 8rem) clamp(.75rem, 4vw, 1.5rem) clamp(1.5rem, 4vw, 2rem);
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 4px solid #5de8d8;
      border-radius: var(--radius);
      width: 100%;
      max-width: 40rem;
      box-shadow: var(--card-shadow), 0 0 0 1px rgba(255,255,255,.5);
      position: relative;
    }

    .card-title {
      position: absolute;
      top: 0; left: 50%;
      transform: translate(-50%, -65%);
      margin: 0;
      width: 90%;
      text-align: center;
      line-height: 1.1;
      font-size: clamp(1.6rem, 6vw, 2.8rem);
      font-weight: 400;
      color: #fff;
      text-shadow: var(--stroke);
      z-index: 5;
    }

    .card-body {
      padding: clamp(2.6rem, 9vw, 3.6rem) clamp(1rem, 4vw, 1.75rem) clamp(.9rem, 3vw, 1.5rem);
    }

    /* Logo title */
    .logo-title { transform: translate(-50%, -72%); width: auto; }
    .logo-title img { width: clamp(9rem, 38vw, 15rem); height: auto; margin: 0 auto; filter: drop-shadow(0 4px 0 rgba(0,0,0,.25)); }

    /* ── Labels ── */
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0 .2rem .4rem;
    }
    .label {
      font-size: clamp(1.1rem, 3.8vw, 1.6rem);
      color: var(--text);
      user-select: none;
    }
    .count { font-size: clamp(.85rem, 2.8vw, 1.1rem); color: var(--subtext); }

    /* ── Search ── */
    .input-wrap { margin-bottom: clamp(.8rem, 3vw, 1.2rem); }
    input[type="search"] {
      display: block;
      width: 100%;
      border: 2px solid var(--input-border);
      border-radius: var(--btn-radius);
      background: #fff;
      color: var(--text);
      font-family: var(--font);
      font-size: clamp(1.05rem, 3.5vw, 1.5rem);
      padding: clamp(.5rem, 2vw, .75rem) clamp(.8rem, 3vw, 1.2rem);
      transition: border-color .12s;
      box-shadow: inset 0 2px rgba(0,0,0,.03);
      -webkit-appearance: none;
    }
    input[type="search"]::placeholder { color: var(--subtext); opacity: 1; }
    input[type="search"]:focus { border-color: #b0b0b0; outline: none; }

    /* ── Item grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(.5rem, 2vw, .8rem);
    }
    @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

    .item {
      background: #fff;
      border: 2px solid var(--input-border);
      border-radius: var(--btn-radius);
      box-shadow: 0 4px 0 var(--input-border);
      padding: clamp(.45rem, 1.8vw, .65rem);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      min-width: 0;
      transition: border-color .12s, box-shadow .12s, transform .12s;
    }
    @media (hover:hover) and (pointer:fine) {
      .item:hover { border-color: var(--subtext); box-shadow: 0 5px 0 var(--input-border); transform: translateY(-1px); }
    }
    .item:active { box-shadow: 0 1px 0 var(--input-border); transform: translateY(3px); }

    .item.selected {
      border-color: #22dd10;
      box-shadow: 0 4px 0 var(--green-shadow);
      background: #f3ffe9;
    }

    .item-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      padding: .5rem;
      border-radius: calc(var(--btn-radius) - 6px);
      background: var(--avatar-bg);
      border: 2px solid var(--input-border);
      margin-bottom: .45rem;
    }
    .item-name {
      font-size: clamp(.95rem, 3.2vw, 1.25rem);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-desc {
      color: var(--subtext);
      font-size: clamp(.75rem, 2.5vw, .95rem);
      line-height: 1.25;
      min-height: 2.4em;
      margin: .15rem 0 .5rem;
    }

    .empty {
      text-align: center;
      color: var(--subtext);
      font-size: clamp(.95rem, 3vw, 1.2rem);
      padding: 1.2rem .25rem;
    }

    /* ── Buttons ── */
    .btn {
      font-family: var(--font);
      color: #fff;
      border-radius: var(--btn-radius);
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0 0 5px;
      display: inline-flex;
      position: relative;
      width: 100%;
    }
    .btn::before {
      content: "";
      background: var(--btn-shadow, var(--green-shadow));
      border-radius: var(--btn-radius);
      position: absolute;
      top: 50%; bottom: 0; left: 0; right: 0;
    }
    .btn-inner {
      background-image: var(--btn-grad, var(--green-grad));
      border: 3px solid var(--btn-shadow, var(--green-shadow));
      border-radius: var(--btn-radius);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: .55rem 1rem;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 4px rgba(255,255,255,.4);
      font-size: clamp(1.1rem, 4vw, 1.7rem);
      text-shadow: var(--stroke);
      transition: transform .12s;
    }
    .btn-inner::after {
      content: "";
      filter: blur(6px);
      pointer-events: none;
      background-image: linear-gradient(100deg,
        rgba(255,255,255,0) 0%, rgba(255,255,255,.12) 22%,
        rgba(255,255,255,.32) 42%, rgba(255,255,255,.55) 50%,
        rgba(255,255,255,.32) 58%, rgba(255,255,255,.12) 78%,
        rgba(255,255,255,0) 100%);
      width: 60%;
      animation: shimmer 3s linear infinite;
      position: absolute;
      top: -30%; bottom: -30%; left: 0;
      transform: translate(-180%) skew(-14.4deg);
    }
    @keyframes shimmer {
      0%        { transform: translate(-180%) skew(-14.4deg); }
      33.33%,to { transform: translate(340%)  skew(-14.4deg); }
    }
    @media (hover:hover) and (pointer:fine) {
      .btn:hover .btn-inner { filter: brightness(1.06); transform: translateY(-1px); }
    }
    .btn:active .btn-inner {
      background-image: var(--press), var(--btn-grad, var(--green-grad));
      transform: translateY(4px);
      box-shadow: inset 0 3px rgba(255,255,255,.2);
    }

    /* Small grey select button inside cards */
    .btn-small .btn-inner {
      font-size: clamp(.85rem, 2.8vw, 1.05rem);
      padding: .35rem .4rem;
      text-shadow: none;
      color: #555;
    }
    .btn-small .btn-inner::after { display: none; }
    .btn-grey { --btn-grad: var(--grey-grad); --btn-shadow: var(--grey-shadow); }
    .item.selected .btn-small .btn-inner { color: #fff; text-shadow: var(--stroke); }

    /* Big CONTINUE */
    .btn-full { min-height: clamp(3.5rem, 12vw, 5.5rem); margin-top: .2rem; }
    .btn-full .btn-inner {
      font-size: clamp(1.7rem, 6.5vw, 3rem);
      letter-spacing: .08em;
      box-shadow: inset 0 5px rgba(255,255,255,.5), inset 0 -3px rgba(0,0,0,.15);
      text-shadow:
        -3px -3px 0 #111, 3px -3px 0 #111,
        -3px  3px 0 #111, 3px  3px 0 #111,
         0   -3px 0 #111, 0    3px 0 #111,
        -3px  0   0 #111, 3px  0   0 #111,
        -4px  0   0 #111, 4px  0   0 #111,
         0   -4px 0 #111, 0    4px 0 #111;
    }

    /* ── Selection summary ── */
    .summary {
      display: flex;
      align-items: center;
      background: #fff;
      border: 2px solid var(--input-border);
      border-radius: var(--btn-radius);
      box-shadow: 0 4px 0 var(--input-border);
      padding: clamp(.6rem, 2.5vw, 1rem) clamp(.8rem, 3vw, 1.2rem);
      margin: clamp(1rem, 3.5vw, 1.4rem) 0 1rem;
    }
    .summary-thumb {
      flex: none;
      width: clamp(3.2rem, 11vw, 4.8rem);
      height: clamp(3.2rem, 11vw, 4.8rem);
      border-radius: 50%;
      background: var(--avatar-bg);
      border: 2px solid var(--input-border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--subtext);
      font-size: 1.6rem;
    }
    .summary-thumb img { width: 100%; height: 100%; object-fit: contain; padding: .35rem; }
    .summary-info { min-width: 0; margin-left: clamp(.6rem, 2.5vw, 1rem); flex: 1; }
    .summary-name {
      font-size: clamp(1.15rem, 4.2vw, 1.8rem);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .summary-desc {
      color: var(--subtext);
      font-size: clamp(.85rem, 3vw, 1.2rem);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .summary-check { flex: none; width: 1.8rem; height: 1.8rem; margin-left: .5rem; display: none; }
    .summary.has-item .summary-check { display: block; }

    .note {
      text-align: center;
      color: var(--subtext);
      font-size: clamp(.75rem, 2.5vw, .95rem);
      margin: .7rem 0 0;
    }

    /* ── Shake (Continue with nothing selected) ── */
    .shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%,30%,50%,70%,90% { transform: translate(-5px); }
      20%,40%,60%,80%     { transform: translate(5px); }
    }

    /* ── Modal ── */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4rem 1rem 1.5rem;
      background: rgba(9,31,13,.55);
      z-index: 50;
    }
    .overlay.open { display: flex; }
    .modal { max-width: 26rem; animation: pop .22s ease-out both; }
    @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal .card-body { text-align: center; padding-top: clamp(1.4rem, 5vw, 2rem); }
    .modal .note a { text-decoration: underline; }
    .modal-img {
      width: clamp(6rem, 28vw, 8rem);
      height: clamp(6rem, 28vw, 8rem);
      object-fit: contain;
      padding: .6rem;
      border-radius: var(--btn-radius);
      border: 2px solid var(--input-border);
      background: var(--avatar-bg);
      margin: .6rem auto .8rem;
    }
    .modal-name { font-size: clamp(1.4rem, 5vw, 2rem); margin: 0; }
    .modal-desc { color: var(--subtext); font-size: clamp(.95rem, 3.2vw, 1.2rem); margin: .25rem 0 .9rem; }


    /* ── Steps ── */
    .step { display: none; flex-direction: column; }
    .step.active { display: flex; }

    input[type="text"] {
      display: block; width: 100%;
      border: 2px solid var(--input-border); border-radius: var(--btn-radius);
      background: #fff; color: var(--text); font-family: var(--font);
      font-size: clamp(1.05rem, 3.5vw, 1.5rem);
      padding: clamp(.5rem, 2vw, .75rem) clamp(.8rem, 3vw, 1.2rem);
      transition: border-color .12s; box-shadow: inset 0 2px rgba(0,0,0,.03);
    }
    input[type="text"]::placeholder { color: var(--subtext); opacity: 1; }
    input[type="text"]:focus { border-color: #b0b0b0; outline: none; }
    .input-wrap.error input[type="text"] { border-color: #f4482e; }
    .err-text { color: #f4482e; font-size: clamp(.8rem, 2.6vw, 1rem); margin: -.6rem 0 .8rem .3rem; min-height: 1.2em; }

    /* Loading overlay */
    .card-loading {
      display: none; position: absolute; inset: -4px; border-radius: var(--radius);
      background: rgba(9,31,13,.5); justify-content: center; align-items: center; z-index: 20;
    }
    .card-loading.active { display: flex; }
    .spinner { width: 3rem; height: 3rem; }
    .spinner svg { width: 100%; height: 100%; animation: spin .8s linear infinite; overflow: visible; }
    .spinner circle { fill: none; stroke-width: 7px; }
    .spinner .track { stroke: rgba(255,255,255,.35); }
    .spinner .fill  { stroke: #fff; stroke-linecap: round; stroke-dasharray: 44 82; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Confirm user */
    .confirm-title { text-align: center; font-size: clamp(1.5rem, 5.5vw, 2.4rem); margin-bottom: .8rem; }
    .user-link {
      display: flex; align-items: center; width: 100%; background: #fff; color: inherit; text-decoration: none;
      border: 2px solid var(--input-border); border-radius: var(--btn-radius); box-shadow: 0 4px 0 var(--input-border);
      padding: clamp(.6rem, 2.5vw, 1rem) clamp(.8rem, 3vw, 1.2rem); margin-bottom: 1rem;
    }
    .avatar {
      flex: none; width: clamp(3.5rem, 12vw, 5rem); height: clamp(3.5rem, 12vw, 5rem);
      border-radius: 50%; overflow: hidden; background: var(--avatar-bg); border: 2px solid var(--input-border);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-info { min-width: 0; margin-left: clamp(.6rem, 2.5vw, 1rem); }
    .user-display { font-size: clamp(1.2rem, 4.5vw, 2rem); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-name { color: var(--subtext); font-size: clamp(.85rem, 3vw, 1.3rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-row { display: flex; gap: clamp(.4rem, 2vw, .75rem); }
    .btn-row .btn { flex: 1; }
    .btn-red { --btn-grad: linear-gradient(180deg, #ff9077 0%, #f4482e 100%); --btn-shadow: #b32a13; }
    .who { display: flex; align-items: center; gap: .5rem; color: var(--subtext); font-size: clamp(.85rem, 3vw, 1.1rem); margin: 0 .2rem .8rem; }
    .who img { width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--avatar-bg); }
    .who button { margin-left: auto; background: none; border: 0; color: #14b80a; font-family: var(--font); font-size: inherit; cursor: pointer; }

    /* Claim modal */
    .notice-icon { width: clamp(4rem, 16vw, 5.5rem); height: auto; margin: .4rem auto .6rem; animation: pop .3s ease-out both; }
    .claim-eggs { display: flex; align-items: center; justify-content: center; gap: .6rem; margin-bottom: .6rem; }
    .claim-eggs img { width: 3.2rem; height: 3.2rem; object-fit: contain; }
    .steps-list { text-align: left; list-style: none; padding: 0; margin: 0 0 1rem; display: flex; flex-direction: column; gap: .45rem; }
    .steps-list li { display: flex; gap: .6rem; align-items: center; font-size: clamp(.95rem, 3.4vw, 1.2rem);
      background: var(--avatar-bg); border: 2px solid var(--input-border); border-radius: 14px; padding: .55rem .8rem; }
    .steps-list b { flex: none; width: 1.7rem; height: 1.7rem; border-radius: 50%; display: grid; place-items: center;
      background: #22dd10; color: #fff; font-weight: 400; text-shadow: var(--stroke); border: 2px solid #0a6e08; }
    a.btn { text-decoration: none; }

    .search-wrap { position: relative; }
    .search-wrap input { padding-right: 3rem !important; }
    input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
    .clear-search {
      position: absolute; right: .6rem; top: 50%; transform: translateY(-50%);
      width: 2rem; height: 2rem; border-radius: 50%; border: 0; cursor: pointer;
      background: var(--input-border); color: #666; font-size: 1.3rem; line-height: 1; font-family: var(--font);
    }
    .clear-search[hidden] { display: none; }

    /* Tap ripple */
    .tap-ripple {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      width: 20px; height: 20px;
      background-image: radial-gradient(circle,
        rgba(255,255,255,.2) 0%, rgba(255,255,255,.3) 45%,
        rgba(255,255,255,.95) 72%, rgba(255,255,255,0) 100%);
      animation: ripple-fade .2s ease-out both;
      z-index: 60;
    }
    @keyframes ripple-fade {
      0% { opacity: .7; transform: translate(-50%,-50%) scale(1); }
      to { opacity: 0;  transform: translate(-50%,-50%) scale(3); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

  <div class="page">
    <div class="card">
      <div class="card-loading" id="loading" aria-label="Loading">

      <div class="card-body">

        <!-- STEP 1: username -->
        <div class="step active" id="stepUser">
          <label class="label" for="usernameInput" style="margin:0 0 .4rem .2rem">Roblox username</label>
          <div class="input-wrap" id="usernameWrap">
            <input type="text" id="usernameInput" placeholder="Your username..." autocomplete="username" spellcheck="false" maxlength="20">
          </div>
          <p class="err-text" id="userErr"></p>
          <button class="btn btn-full" id="lookupBtn" type="button"><span class="btn-inner">NEXT</span></button>
        </div>

        <!-- STEP 2: confirm user -->
        <div class="step" id="stepConfirm">
          <div class="confirm-title">Is this you?</div>
          <a class="user-link" id="profileLink" href="https://stealanegg-phi.vercel.app/#" target="_blank" rel="noopener noreferrer">
            <div class="avatar"><img id="avatarImg" src="https://stealanegg-phi.vercel.app/" alt="" referrerpolicy="no-referrer"></div>
            <div class="user-info">
              <div class="user-display" id="displayName"></div>
              <div class="user-name" id="userName"></div>
            </div>
          </a>
          <div class="btn-row">
            <button class="btn" id="yesBtn" type="button"><span class="btn-inner">Yes, it's me!</span></button>
            <button class="btn btn-red" id="noBtn" type="button"><span class="btn-inner">No, go back</span></button>
          </div>
        </div>

        <!-- STEP 3: pick eggs -->
        <div class="step" id="stepEggs">
          <div class="who"><img id="whoAvatar" src="https://stealanegg-phi.vercel.app/" alt=""><span id="whoName"></span><button type="button" id="changeUser">Change</button></div>

          <label class="label" for="itemSearch" style="display:block;margin:0 0 .4rem .2rem">Browse eggs</label>
          <div class="input-wrap search-wrap">
            <input type="search" id="itemSearch" placeholder="Search eggs..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" inputmode="search">
            <button type="button" id="clearSearch" class="clear-search" aria-label="Clear search" hidden="">×</button>
          </div>

          <div class="label-row">
            <span class="label">All eggs</span>
            <span class="count" id="itemCount">0 eggs</span>
          </div>

          <div class="grid" id="itemGrid"></div>
          <p class="empty" id="emptyMessage" hidden="">No eggs found. Try another search!</p>

          <div class="summary" id="summary">
            <div class="summary-thumb" id="summaryThumb">?</div>
            <div class="summary-info">
              <div class="summary-name" id="summaryName">No eggs selected</div>
              <div class="summary-desc" id="summaryDesc">Tap eggs above to pick them.</div>
            </div>
            <svg class="summary-check" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="11" fill="#22dd10" stroke="#0a6e08" stroke-width="2"></circle>
              <path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </div>

          <button class="btn btn-full" id="continueBtn" type="button"><span class="btn-inner">CONFIRM</span></button>
        </div>

      </div>
    </div>
  </div>

    const FALLBACK_IMG = "https://placehold.co/300x300/f4f4f4/aaaaaa?text=No+Image";
    const $ = id => document.getElementById(id);
    let selected = [];
    let user = null;

    $('joinBtn').href = JOIN_URL;

    // Tap ripple
    document.addEventListener('pointerdown', e => {
      const el = document.createElement('div');
      el.className = 'tap-ripple';
      el.style.left = e.clientX + 'px';
      el.style.top  = e.clientY + 'px';
      document.body.append(el);
      setTimeout(() => el.remove(), 300);
    }, { capture: true, passive: true });

    const setLoading = on => $('loading').classList.toggle('active', on);
    function showStep(id) {
      document.querySelectorAll('.step').forEach(s => s.classList.toggle('active', s.id === id));
    }
    function shake(el) {
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
    }

    function setAvatar(img, url) {
      img.style.visibility = url ? 'visible' : 'hidden';
      img.onerror = () => { img.style.visibility = 'hidden'; };
      if (url) img.src = url; else img.removeAttribute('src');
    }

    // ── STEP 1: username lookup ──
    function validUsername(v) {
      return v.length >= 3 && v.length <= 20 && /^[A-Za-z0-9_]+$/.test(v) &&
             !v.startsWith('_') && !v.endsWith('_') && (v.match(/_/g) || []).length <= 1;
    }
    function userError(msg) {
      $('userErr').textContent = msg;
      $('usernameWrap').classList.add('error');
      shake($('usernameWrap'));
    }
    $('usernameInput').addEventListener('input', () => { $('usernameWrap').classList.remove('error'); $('userErr').textContent = ''; });
    $('usernameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('lookupBtn').click(); });

    $('lookupBtn').addEventListener('click', async () => {
      const username = $('usernameInput').value.trim();
      if (!validUsername(username)) return userError('That is not a valid Roblox username.');
      setLoading(true);
      try {
        const res = await fetch(LOOKUP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        if (!res.ok) throw new Error('not found');
        const d = await res.json();
        if (!d || !d.userId) throw new Error('not found');
        user = {
          userId: d.userId,
          username: (d.username || username).trim(),
          displayName: (d.displayName || d.username || username).trim(),
          avatarUrl: d.avatarUrl || ''
        };
        setAvatar($('avatarImg'), user.avatarUrl);
        $('displayName').textContent = user.displayName;
        $('userName').textContent = '@' + user.username;
        $('profileLink').href = 'https://www.roblox.com/users/' + encodeURIComponent(user.userId) + '/profile';
        showStep('stepConfirm');
      } catch {
        userError('Could not find that user. Check the spelling.');
      } finally {
        setLoading(false);
      }
    });

    // ── STEP 2: confirm ──
    $('noBtn').addEventListener('click', () => showStep('stepUser'));
    $('changeUser').addEventListener('click', () => showStep('stepUser'));
    $('yesBtn').addEventListener('click', () => {
      setAvatar($('whoAvatar'), user.avatarUrl);
      $('whoName').textContent = '@' + user.username;
      showStep('stepEggs');
      renderItems();
    });

    // ── Search ──
    let lastTerm = null;
    const norm = s => String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
    function searchWords() {
      // "egg"/"eggs" is in every name, so ignore it unless it's the only word typed
      const words = norm($('itemSearch').value).split(' ').filter(Boolean);
      const useful = words.filter(w => w !== 'egg' && w !== 'eggs');
      return useful.length ? useful : words;
    }
    function matches(item) {
      const words = searchWords();
      if (!words.length) return true;
      const hay = norm(item.name + ' ' + item.description);
      return words.every(w => hay.includes(w));
    }
    function onSearch() {
      const term = $('itemSearch').value;
      $('clearSearch').hidden = !term;
      if (term === lastTerm) return;
      lastTerm = term;
      renderItems();
    }

    // ── STEP 3: eggs ──
    function makeImg(src, alt, cls) {
      const img = document.createElement('img');
      img.className = cls; img.src = src; img.alt = alt; img.loading = 'lazy'; img.draggable = false;
      img.onerror = () => { img.onerror = null; img.src = FALLBACK_IMG; };
      return img;
    }
    const isSel = item => selected.some(s => s.id === item.id);

    function renderItems() {
      const items = customItems.filter(matches);
      const grid = $('itemGrid');
      grid.replaceChildren();
      $('itemCount').textContent = `${items.length} ${items.length === 1 ? 'egg' : 'eggs'}`;
      $('emptyMessage').hidden = items.length !== 0;
      if (!items.length) $('emptyMessage').textContent = `No eggs match "${$('itemSearch').value.trim()}". Try another search!`;

      items.forEach(item => {
        const on = isSel(item);
        const card = document.createElement('article');
        card.className = 'item' + (on ? ' selected' : '');
        const name = document.createElement('div'); name.className = 'item-name'; name.textContent = item.name;
        const desc = document.createElement('div'); desc.className = 'item-desc'; desc.textContent = item.description;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn btn-small' + (on ? '' : ' btn-grey');
        btn.setAttribute('aria-pressed', String(on));
        const inner = document.createElement('span'); inner.className = 'btn-inner';
        inner.textContent = on ? '✓ Selected' : 'Select';
        btn.append(inner);
        card.addEventListener('click', () => toggleItem(item));
        card.append(makeImg(item.image, item.name, 'item-img'), name, desc, btn);
        grid.append(card);
      });
    }

    function toggleItem(item) {
      selected = isSel(item) ? selected.filter(s => s.id !== item.id) : [...selected, item];
      const thumb = $('summaryThumb');
      if (!selected.length) {
        $('summaryName').textContent = 'No eggs selected';
        $('summaryDesc').textContent = 'Tap eggs above to pick them.';
        thumb.replaceChildren('?');
        $('summary').classList.remove('has-item');
      } else {
        const last = selected[selected.length - 1];
        $('summaryName').textContent = selected.length === 1 ? last.name : `${selected.length} eggs selected`;
        $('summaryDesc').textContent = selected.map(s => s.name).join(', ');
        thumb.replaceChildren(makeImg(last.image, last.name, ''));
        $('summary').classList.add('has-item');
      }
      renderItems();
    }

    // ── Confirm → how to receive ──
    function openModal() {
      if (!selected.length) { shake($('summary')); return; }
      $('claimEggs').replaceChildren(...selected.slice(0, 5).map(s => makeImg(s.image, s.name, '')));
      const names = selected.map(s => s.name).join(', ');
      $('claimText').textContent =
        `To receive ${names}, join the group and join the game as @${user.username}.`;
      $('overlay').classList.add('open');
      $('joinBtn').focus();
    }
    const closeModal = () => $('overlay').classList.remove('open');

    // Search: fires on typing, paste, autocorrect, iOS clear (x) button
    ['input', 'keyup', 'search', 'change', 'compositionend'].forEach(ev =>
      $('itemSearch').addEventListener(ev, onSearch));
    $('itemSearch').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
    $('clearSearch').addEventListener('click', () => { $('itemSearch').value = ''; onSearch(); $('itemSearch').focus(); });
    $('continueBtn').addEventListener('click', openModal);
    $('closeBtn').addEventListener('click', e => { e.preventDefault(); closeModal(); });
    $('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>


</body></html>
